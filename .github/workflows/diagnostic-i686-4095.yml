name: Diagnostic i686 for PR 4095

on:
  push:
    branches:
      - diagnostic/4095-i686-ubuntu24-20261025

permissions:
  contents: read

jobs:
  ubuntu24-pinned-image:
    if: github.repository == 'ZXLyyds100/bat'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CROSS_TARGET_I686_UNKNOWN_LINUX_GNU_IMAGE: ghcr.io/cross-rs/i686-unknown-linux-gnu@sha256:d2b6b9cb593ab84fe505e2bb1b6025e5f44e3e91cf55f8abf6979b46a6a5cc0a
    steps:
      - name: Checkout exact PR source, excluding this diagnostic workflow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 053089941041e54afe515038122a499345d3fca7
          persist-credentials: false

      - name: Verify source and host
        run: |
          test "$(git rev-parse HEAD)" = 053089941041e54afe515038122a499345d3fca7
          cat /etc/os-release
          uname -a
          docker version

      - name: Install the Rust version used by both historical jobs
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target i686-unknown-linux-gnu
          rustup override set 1.99.1
          rustc -Vv
          cargo -V

      - name: Install the upstream-pinned cross revision
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 588b3c99db52b5a9c5906fab96cfadcf1bde7863

      - name: Pull and record the historical successful image
        run: |
          docker pull "$CROSS_TARGET_I686_UNKNOWN_LINUX_GNU_IMAGE"
          docker image inspect "$CROSS_TARGET_I686_UNKNOWN_LINUX_GNU_IMAGE" --format '{{json .RepoDigests}}'
          cross --version

      - name: Release build as in upstream CICD
        run: cross build --locked --release --target=i686-unknown-linux-gnu

      - name: Focused regression, without skipping or altering the test
        run: cross test --locked --target=i686-unknown-linux-gnu --test integration_tests no_args_doesnt_break -- --exact

      - name: Full test command as in upstream CICD
        run: cross test --locked --target=i686-unknown-linux-gnu
